# Lokal ishlab chiqish uchun Supabase sozlamalari (supabase start)
project_id = "texnikum-davomat"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# OCHIQ RO‘YXATDAN O‘TISH O‘CHIRILGAN. Foydalanuvchilarni faqat Edge Function yaratadi.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

# Edge Function'lar JWT/maxfiy kalitni o‘zlari tekshiradi (_shared/common.ts)
[functions.bootstrap-admin]
verify_jwt = false
[functions.create-group-leader]
verify_jwt = false
[functions.manage-group-leader]
verify_jwt = false
[functions.list-users]
verify_jwt = false
